<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>math - A web app for basic arithmetic calculations.</title>
  </head>
  <body>
    <h1>math</h1>
    <div class="container">
      <input id="input" type="text" inputmode="none" />
      <div class="clear-btn-con">
        <button class="clear-btn" onclick="btn_action('clear')">Clear</button>
      </div>
      <div class="buttons">
        <button class="btn" onclick="btn_action('backspace')">BS</button>
        <button class="btn" onclick="btn_action('(')">(</button>
        <button class="btn" onclick="btn_action(')')">)</button>
        <button class="btn" onclick="btn_action('equals')">=</button>
        <button class="btn" onclick="btn_action('7')">7</button>
        <button class="btn" onclick="btn_action('8')">8</button>
        <button class="btn" onclick="btn_action('9')">9</button>
        <button class="btn" onclick="btn_action('/')">/</button>
        <button class="btn" onclick="btn_action('4')">4</button>
        <button class="btn" onclick="btn_action('5')">5</button>
        <button class="btn" onclick="btn_action('6')">6</button>
        <button class="btn" onclick="btn_action('*')">*</button>
        <button class="btn" onclick="btn_action('1')">1</button>
        <button class="btn" onclick="btn_action('2')">2</button>
        <button class="btn" onclick="btn_action('3')">3</button>
        <button class="btn" onclick="btn_action('-')">-</button>
        <button class="btn" onclick="btn_action('0')">0</button>
        <button class="btn" onclick="btn_action('.')">.</button>
        <button class="btn" onclick="btn_action('%')">%</button>
        <button class="btn" onclick="btn_action('+')">+</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/logic.js"></script>
  </body>
</html>
